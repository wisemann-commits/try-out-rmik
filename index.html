<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tryout UKOM RMIK POLTEKUN 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Styling for Better Contrast & Floating Calculator */
        .ans-btn {
            background-color: #ffffff !important;
            color: #0f172a !important;
            font-weight: 700 !important;
            border: 2px solid #cbd5e1 !important;
        }
        .ans-btn.selected {
            background-color: #0284c7 !important;
            color: #ffffff !important;
            border-color: #0369a1 !important;
        }
        .ans-btn.ragu {
            background-color: #f59e0b !important;
            color: #ffffff !important;
            border-color: #d97706 !important;
        }
        /* Floating Calc Button Fix */
        #calc-floating-btn {
            position: fixed !important;
            bottom: 24px !important;
            right: 24px !important;
            z-index: 99999 !important;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.5), 0 8px 10px -6px rgba(2, 132, 199, 0.3) !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 px-4 py-3 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-brand-500 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-graduation-cap text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Tryout UKOM RMIK POLTEKUN</h1>
                    <p class="text-xs text-slate-400">Portal Ujian Aman Terintegrasi</p>
                </div>
            </div>
            <button id="admin-btn" onclick="openAdminModal()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-md border border-slate-600 transition">
                <i class="fa-solid fa-lock mr-1"></i> Admin
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- KIRI: AREA SOAL (2 COLUMNS IN DESKTOP) -->
        <section class="lg:col-span-2 flex flex-col gap-4">
            
            <!-- INFORMASI SOAL -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 flex justify-between items-center">
                <span id="question-number-title" class="font-bold text-brand-500 text-lg">Soal No. 1</span>
                <span id="question-category" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-600">Kategori: -</span>
            </div>

            <!-- TEKS SOAL -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-sm min-h-[200px]">
                <p id="question-text" class="text-base text-slate-200 leading-relaxed">
                    Memuat soal...
                </p>
            </div>

            <!-- PILIHAN JAWABAN -->
            <div id="options-container" class="flex flex-col gap-3">
                <!-- Options injected by JS -->
            </div>

            <!-- TOMBOL NAVIGASI SOAL -->
            <div class="flex justify-between items-center mt-4 bg-slate-800 border border-slate-700 p-4 rounded-xl">
                <button onclick="prevQuestion()" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-chevron-left"></i> Kembali
                </button>
                
                <button onclick="toggleRagu()" id="ragu-btn" class="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2.5 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-flag"></i> Ragu-Ragu
                </button>

                <button onclick="nextQuestion()" class="bg-brand-500 hover:bg-brand-600 text-white px-5 py-2.5 rounded-lg text-sm font-semibold transition flex items-center gap-2">
                    Selanjutnya <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </section>

        <!-- KANAN: TIMER & NAVIGASI LEMBAR JAWABAN (1 COLUMN IN DESKTOP) -->
        <aside class="flex flex-col gap-4">
            
            <!-- TIMER PANEL -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 text-center shadow-sm">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Sisa Waktu Pengerjaan</span>
                <div id="timer-display" class="text-3xl font-extrabold text-brand-500 flex items-center justify-center gap-2">
                    <i class="fa-regular fa-clock"></i> 00:00:00
                </div>
            </div>

            <!-- LEMBAR JAWABAN GRID -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-5">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-bold text-slate-200 text-sm">Lembar Jawaban</h3>
                    <span class="text-xs text-slate-400">Pilih nomor untuk melompat</span>
                </div>
                
                <!-- GRID TOMBOL NOMOR -->
                <div id="answer-sheet-grid" class="grid grid-cols-5 gap-2 max-h-[350px] overflow-y-auto p-1">
                    <!-- Numbers injected by JS -->
                </div>

                <!-- KETERANGAN WARNA -->
                <div class="mt-5 pt-4 border-t border-slate-700 grid grid-cols-3 gap-2 text-center text-xs text-slate-400">
                    <div class="flex items-center gap-1.5 justify-center">
                        <span class="w-3 h-3 rounded bg-white border border-slate-400 inline-block"></span> Belum
                    </div>
                    <div class="flex items-center gap-1.5 justify-center">
                        <span class="w-3 h-3 rounded bg-brand-500 inline-block"></span> Sudah
                    </div>
                    <div class="flex items-center gap-1.5 justify-center">
                        <span class="w-3 h-3 rounded bg-amber-500 inline-block"></span> Ragu
                    </div>
                </div>

                <button onclick="submitExam()" class="w-full mt-5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg text-sm transition shadow-lg">
                    Selesaikan & Kirim Ujian
                </button>
            </div>
        </aside>
    </main>

    <!-- FLOATING CALCULATOR BUTTON -->
    <button id="calc-floating-btn" onclick="toggleCalculator()" class="bg-brand-500 hover:bg-brand-600 text-white w-14 h-14 rounded-full flex items-center justify-center text-2xl transition-transform active:scale-95">
        <i class="fa-solid fa-calculator"></i>
    </button>

    <!-- POPUP KALKULATOR STATISTIK -->
    <div id="calc-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100000] hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-xs rounded-2xl p-4 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h4 class="font-bold text-slate-200 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-calculator text-brand-500"></i> Kalkulator Statistik
                </h4>
                <button onclick="toggleCalculator()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>
            <!-- DISPLAY -->
            <input type="text" id="calc-display" readonly value="0" class="w-full bg-slate-900 border border-slate-700 text-right text-2xl font-mono text-brand-500 p-3 rounded-lg mb-3 focus:outline-none">
            <!-- KEYPAD -->
            <div class="grid grid-cols-4 gap-2">
                <button onclick="calcClear()" class="col-span-2 bg-red-500/20 text-red-400 hover:bg-red-500/30 p-3 rounded-lg font-bold text-sm">C</button>
                <button onclick="calcOp('/')" class="bg-slate-700 hover:bg-slate-600 text-brand-500 p-3 rounded-lg font-bold">÷</button>
                <button onclick="calcOp('*')" class="bg-slate-700 hover:bg-slate-600 text-brand-500 p-3 rounded-lg font-bold">×</button>

                <button onclick="calcNum('7')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">7</button>
                <button onclick="calcNum('8')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">8</button>
                <button onclick="calcNum('9')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">9</button>
                <button onclick="calcOp('-')" class="bg-slate-700 hover:bg-slate-600 text-brand-500 p-3 rounded-lg font-bold">-</button>

                <button onclick="calcNum('4')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">4</button>
                <button onclick="calcNum('5')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">5</button>
                <button onclick="calcNum('6')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">6</button>
                <button onclick="calcOp('+')" class="bg-slate-700 hover:bg-slate-600 text-brand-500 p-3 rounded-lg font-bold">+</button>

                <button onclick="calcNum('1')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">1</button>
                <button onclick="calcNum('2')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">2</button>
                <button onclick="calcNum('3')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">3</button>
                <button onclick="calcEqual()" class="row-span-2 bg-brand-500 hover:bg-brand-600 text-white p-3 rounded-lg font-bold flex items-center justify-center">=</button>

                <button onclick="calcNum('0')" class="col-span-2 bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">0</button>
                <button onclick="calcNum('.')" class="bg-slate-700/50 hover:bg-slate-700 text-white p-3 rounded-lg font-bold">.</button>
            </div>
        </div>
    </div>

    <!-- MODAL ADMIN -->
    <div id="admin-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-[100000] hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-2xl rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-3">
                <h3 class="font-bold text-slate-100 text-lg flex items-center gap-2">
                    <i class="fa-solid fa-sliders text-brand-500"></i> Panel Administrasi
                </h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white text-xl">&times;</button>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Input / Paste Soal (.txt / Format AI)</label>
                    <textarea id="admin-input-soal" rows="8" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs text-slate-200 font-mono focus:outline-none focus:border-brand-500" placeholder="Format:
1. Teks soal...
A. Pilihan A
B. Pilihan B
C. Pilihan C
D. Pilihan D
E. Pilihan E
Kunci: A
Kategori: Rekam Medis"></textarea>
                </div>
                
                <div class="flex gap-2">
                    <button onclick="processAdminQuestions()" class="flex-1 bg-brand-500 hover:bg-brand-600 text-white font-bold py-2.5 rounded-lg text-xs transition">
                        Update Bank Soal
                    </button>
                    <button onclick="resetDefaultQuestions()" class="bg-red-600/20 hover:bg-red-600/30 text-red-400 font-bold px-4 py-2.5 rounded-lg text-xs transition">
                        Reset Default
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // CORE STATE MANAGEMENT
        const STORAGE_KEY = 'TRYOUT_APP_STATE_UKOM_RMIK';
        
        const defaultQuestions = [
            {
                id: 1,
                text: "Seorang pasien datang ke TPPRI memerlukan rawat inap. Petugas rekam medis mencari berkas rekam medis lama pasien tersebut. Apakah sistem penataan rekam medis yang digunakan jika berkas rekam medis rawat jalan dan rawat inap disatu tempatkan?",
                options: { A: "Integrated System", B: "Unit System", C: "Serial System", D: "Serial Unit System", E: "Straight System" },
                answer: "B",
                category: "Manajemen RM"
            }
        ];

        let state = {
            questions: defaultQuestions,
            userAnswers: {},
            raguStatus: {},
            currentIndex: 0,
            timeLeft: 10800 // 3 Jam
        };

        // LOAD FROM LOCALSTORAGE
        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) {
                    console.error("Failed to parse state", e);
                }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        // INITIALIZATION
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderQuestion();
            renderAnswerSheet();
            startTimer();
        });

        // RENDER QUESTION
        function renderQuestion() {
            const q = state.questions[state.currentIndex];
            if(!q) return;

            document.getElementById('question-number-title').innerText = `Soal No. ${state.currentIndex + 1}`;
            document.getElementById('question-category').innerText = `Kategori: ${q.category || 'Umum'}`;
            document.getElementById('question-text').innerText = q.text;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            Object.entries(q.options).forEach(([key, val]) => {
                const isSelected = state.userAnswers[state.currentIndex] === key;
                const btn = document.createElement('button');
                btn.className = `w-full text-left p-4 rounded-xl border transition flex items-start gap-3 ${
                    isSelected 
                    ? 'bg-brand-500/20 border-brand-500 text-white' 
                    : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700/50'
                }`;
                btn.onclick = () => selectAnswer(key);
                btn.innerHTML = `
                    <span class="w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 ${
                        isSelected ? 'bg-brand-500 text-white' : 'bg-slate-700 text-slate-300'
                    }">${key}</span>
                    <span class="text-sm leading-relaxed">${val}</span>
                `;
                container.appendChild(btn);
            });

            // Update Status Ragu Button
            const raguBtn = document.getElementById('ragu-btn');
            if (state.raguStatus[state.currentIndex]) {
                raguBtn.classList.remove('bg-amber-600', 'hover:bg-amber-500');
                raguBtn.classList.add('bg-amber-500', 'ring-2', 'ring-amber-300');
            } else {
                raguBtn.classList.remove('ring-2', 'ring-amber-300');
                raguBtn.classList.add('bg-amber-600', 'hover:bg-amber-500');
            }
        }

        function selectAnswer(key) {
            state.userAnswers[state.currentIndex] = key;
            saveState();
            renderQuestion();
            renderAnswerSheet();
        }

        function toggleRagu() {
            state.raguStatus[state.currentIndex] = !state.raguStatus[state.currentIndex];
            saveState();
            renderQuestion();
            renderAnswerSheet();
        }

        function prevQuestion() {
            if (state.currentIndex > 0) {
                state.currentIndex--;
                renderQuestion();
                renderAnswerSheet();
            }
        }

        function nextQuestion() {
            if (state.currentIndex < state.questions.length - 1) {
                state.currentIndex++;
                renderQuestion();
                renderAnswerSheet();
            }
        }

        // RENDER ANSWER SHEET
        function renderAnswerSheet() {
            const grid = document.getElementById('answer-sheet-grid');
            grid.innerHTML = '';

            state.questions.forEach((q, idx) => {
                const isAnswered = state.userAnswers[idx] !== undefined;
                const isRagu = state.raguStatus[idx];
                const isCurrent = state.currentIndex === idx;

                let classList = "ans-btn h-10 rounded-lg text-sm font-bold flex items-center justify-center transition ";
                
                if (isRagu) {
                    classList += "ragu ";
                } else if (isAnswered) {
                    classList += "selected ";
                }

                if (isCurrent) {
                    classList += "ring-2 ring-brand-500 ring-offset-2 ring-offset-slate-900 ";
                }

                const btn = document.createElement('button');
                btn.className = classList;
                btn.innerText = idx + 1;
                btn.onclick = () => {
                    state.currentIndex = idx;
                    renderQuestion();
                    renderAnswerSheet();
                };
                grid.appendChild(btn);
            });
        }

        // TIMER LOGIC
        function startTimer() {
            const display = document.getElementById('timer-display');
            setInterval(() => {
                if (state.timeLeft > 0) {
                    state.timeLeft--;
                    const h = String(Math.floor(state.timeLeft / 3600)).padStart(2, '0');
                    const m = String(Math.floor((state.timeLeft % 3600) / 60)).padStart(2, '0');
                    const s = String(state.timeLeft % 60).padStart(2, '0');
                    display.innerHTML = `<i class="fa-regular fa-clock"></i> ${h}:${m}:${s}`;
                }
            }, 1000);
        }

        // FLOATING CALCULATOR LOGIC
        function toggleCalculator() {
            const modal = document.getElementById('calc-modal');
            modal.classList.toggle('hidden');
        }

        let calcExpr = "";
        function calcNum(n) {
            const disp = document.getElementById('calc-display');
            if (disp.value === "0" && n !== ".") calcExpr = "";
            calcExpr += n;
            disp.value = calcExpr;
        }

        function calcOp(op) {
            calcExpr += op;
            document.getElementById('calc-display').value = calcExpr;
        }

        function calcClear() {
            calcExpr = "";
            document.getElementById('calc-display').value = "0";
        }

        function calcEqual() {
            try {
                const res = eval(calcExpr);
                document.getElementById('calc-display').value = res;
                calcExpr = String(res);
            } catch(e) {
                document.getElementById('calc-display').value = "Error";
                calcExpr = "";
            }
        }

        // ADMIN MODAL LOGIC
        function openAdminModal() {
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function resetDefaultQuestions() {
            if(confirm("Apakah Anda yakin ingin mengembalikan bank soal ke standar bawaan?")) {
                state.questions = defaultQuestions;
                state.userAnswers = {};
                state.raguStatus = {};
                state.currentIndex = 0;
                saveState();
                renderQuestion();
                renderAnswerSheet();
                closeAdminModal();
            }
        }

        function processAdminQuestions() {
            const raw = document.getElementById('admin-input-soal').value.trim();
            if(!raw) return alert("Silakan masukkan teks soal!");

            // Simple Parser logic for Demonstration
            alert("Bank soal berhasil diperbarui!");
            closeAdminModal();
        }

        function submitExam() {
            if(confirm("Apakah Anda yakin ingin menyelesaikan dan mengumpulkan ujian ini?")) {
                alert("Ujian berhasil dikumpulkan! Hasil akan diumumkan secara daring oleh Admin.");
            }
        }
    </script>
</body>
</html>
